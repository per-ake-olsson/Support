name: Generate PDFs for Markdown

on:
  push:
    branches:
      - main
    paths:
      # Watch Swedish documentation markdown files
      - 'Key2Pass/Win/Swe/downloads/**/*.md'
      - 'Key2Voice/Win/Swe/downloads/**/*.md'
      - 'Key2Voice/Win/Eng/downloads/**/*.md'
      - 'Key2Voice/Azure/Swe/**/*.md'
      # Watch English documentation markdown files
      - 'Key2Pass/Win/Eng/downloads/**/*.md'
  workflow_dispatch:

jobs:
  md_to_pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Generate PDFs
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          # Keep discovery, conversion and staging scoped to the same directories.
          directories=(
            Key2Pass/Win/Swe/downloads
            Key2Pass/Win/Eng/downloads
            Key2Voice/Win/Swe/downloads
            Key2Voice/Win/Eng/downloads
            Key2Voice/Azure/Swe
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=()
            for dir in "${directories[@]}"; do
              if [ -d "$dir" ]; then
                while IFS= read -r -d '' file; do
                  files+=("$file")
                done < <(find "$dir" -type f -name '*.md' -print0)
              fi
            done
          else
            # Exclude deleted files: only existing Markdown sources can be converted.
            mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event.before }}" "${{ github.sha }}" -- \
              'Key2Pass/Win/Swe/downloads/**/*.md' \
              'Key2Pass/Win/Eng/downloads/**/*.md' \
              'Key2Voice/Win/Swe/downloads/**/*.md' \
              'Key2Voice/Win/Eng/downloads/**/*.md' \
              'Key2Voice/Azure/Swe/**/*.md')
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Markdown files to convert."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            echo "Converting ${file}"
            pandoc "${file}" -o "${file%.md}.pdf" -V geometry:top=20mm -V geometry:left=15mm -V geometry:right=15mm -V geometry:bottom=20mm
          done

          # Check if any PDF files have been added or changed
          if git status --porcelain -- '*.pdf' '**/*.pdf' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated PDFs
        if: steps.generate.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          # Stage generated PDFs in all monitored documentation directories.
          add: |
            Key2Pass/Win/Swe/downloads/**/*.pdf
            Key2Pass/Win/Eng/downloads/**/*.pdf
            Key2Voice/Win/Swe/downloads/**/*.pdf
            Key2Voice/Win/Eng/downloads/**/*.pdf
            Key2Voice/Azure/Swe/**/*.pdf
          message: 'chore: auto-generate PDF for updated manuals'
          default_author: github_actions
