name: Generate PDFs for Markdown

on:
  push:
    branches:
      - main
    paths:
      # Watch Swedish documentation markdown files
      - 'Key2Pass/Win/Swe/downloads/**/*.md'
      - 'Key2Voice/Win/Swe/downloads/**/*.md'
      - 'Key2Voice/Win/Eng/downloads/**/*.md'
      - 'Key2Voice/Azure/Swe/**/*.md'
      # Watch English documentation markdown files
      - 'Key2Pass/Win/Eng/downloads/**/*.md'
  workflow_dispatch:

jobs:
  md_to_pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Generate PDFs
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          # Keep discovery, conversion and staging scoped to the same directories.
          directories=(
            Key2Pass/Win/Swe/downloads
            Key2Pass/Win/Eng/downloads
            Key2Voice/Win/Swe/downloads
            Key2Voice/Win/Eng/downloads
            Key2Voice/Azure/Swe
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=()
            for dir in "${directories[@]}"; do
              if [ -d "$dir" ]; then
                while IFS= read -r -d '' file; do
                  files+=("$file")
                done < <(find "$dir" -type f -name '*.md' -print0)
              fi
            done
          else
            # Git pathspecs for directories also match files directly inside them.
            # Filter by extension separately to avoid glob semantics differences.
            mapfile -d '' -t candidates < <(git diff --name-only --diff-filter=ACMR -z \
              "${{ github.event.before }}" "${{ github.sha }}" -- "${directories[@]}")
            files=()
            for file in "${candidates[@]}"; do
              if [[ "$file" == *.md && -f "$file" ]]; then
                files+=("$file")
              fi
            done
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Markdown files to convert."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            echo "Converting ${file}"
            pandoc "${file}" -o "${file%.md}.pdf" -V geometry:top=20mm -V geometry:left=15mm -V geometry:right=15mm -V geometry:bottom=20mm
          done

          # Check for generated or updated PDF files only.
          changed=false
          while IFS= read -r -d '' file; do
            if [[ "$file" == *.pdf ]]; then
              changed=true
              break
            fi
          done < <(git status --porcelain -z -- "${directories[@]}" | sed -z 's/^...//')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit generated PDFs
        if: steps.generate.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            Key2Pass/Win/Swe/downloads
            Key2Pass/Win/Eng/downloads
            Key2Voice/Win/Swe/downloads
            Key2Voice/Win/Eng/downloads
            Key2Voice/Azure/Swe
          message: 'chore: auto-generate PDF for updated manuals'
          default_author: github_actions
